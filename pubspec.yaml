name: doc_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture & State
  flutter_bloc: ^9.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^8.0.0
  injectable: ^2.5.0
  go_router: ^14.8.0
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  uuid: ^4.5.1
  internet_connection_checker: ^3.0.1
  connectivity_plus: ^6.1.3
  excel: ^4.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.3
  injectable_generator: ^2.6.3
  # hive_generator: omitted due to conflicts

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
